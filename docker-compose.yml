services:
  db:
    image: postgres:16-alpine
    container_name: innasoft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innasoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innasoft}
      POSTGRES_DB: ${POSTGRES_DB:-innasoft}
    ports:
      # Tashqi port 5440 — 5432/5433 boshqa loyihalarda band bo'lishi mumkin
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - innasoft_pgdata:/var/lib/postgresql/data
    healthcheck:
      # App bazaga baza TAYYOR bo'lgandan keyin ulanishi kerak, aks holda
      # birinchi ishga tushishda migratsiya "connection refused" bilan yiqiladi
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innasoft}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: innasoft-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-innasoft}:${POSTGRES_PASSWORD:-innasoft}@db:5432/${POSTGRES_DB:-innasoft}
      # Bot tokenini .env ga yozing — boshqa hech narsa kerak emas
      BOT_TOKEN: ${BOT_TOKEN:-}
      # AI yordamchilar — bittasi yetarli
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVAYDER: ${LLM_PROVAYDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SEED_DEMO: ${SEED_DEMO:-}
      SEED_EMPTY: ${SEED_EMPTY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PORT: 8000
    ports:
      - "${APP_PORT:-8070}:8000"
    volumes:
      # Mahsulot rasmlari konteyner o'chsa ham qolsin
      - innasoft_uploads:/app/uploads

volumes:
  innasoft_pgdata:
  innasoft_uploads:
