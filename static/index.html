<!-- Kraft-karton SVG fon -->
<svg class="paper-bg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1440 900" aria-hidden="true">
  <defs>
    <filter id="kraftTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="9" stitchTiles="stitch" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#efe4cb" surfaceScale="1.6" diffuseConstant="1.04" result="l">
        <feDistantLight azimuth="235" elevation="58"/>
      </feDiffuseLighting>
      <feColorMatrix in="l" type="saturate" values="0.8"/>
    </filter>
    <radialGradient id="warmth" cx="40%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#F8F0DD"/><stop offset="55%" stop-color="#ECDFC4"/><stop offset="100%" stop-color="#D4C49E"/>
    </radialGradient>
    <radialGradient id="lavTR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C2C6FF" stop-opacity="0.5"/><stop offset="100%" stop-color="#C2C6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="900" fill="#ecdfc6" filter="url(#kraftTex)"/>
  <rect width="1440" height="900" fill="url(#warmth)" style="mix-blend-mode:multiply" opacity="0.5"/>
  <rect x="980" y="-260" width="700" height="700" fill="url(#lavTR)"/>
  <rect x="-300" y="520" width="720" height="720" fill="url(#lavTR)" opacity=".6"/>
  <!-- gofra qutilar illyustratsiyasi -->
  <g transform="translate(1150 700)" opacity="0.38" stroke="#8a6a40" stroke-width="3" fill="#E3CFA3" stroke-linejoin="round">
    <ellipse cx="10" cy="150" rx="230" ry="22" fill="#6b572f" stroke="none" opacity="0.12"/>
    <path d="M-160 40 l90 -42 90 42 v78 l-90 42 -90 -42 z" fill="#E8D6AC"/>
    <path d="M-160 40 l90 42 90 -42 M-70 82 v78" fill="none"/>
    <path d="M-160 40 l38 -20 90 42 -38 20 z" fill="#F2E4C2"/>
    <path d="M20 66 l80 -37 80 37 v70 l-80 37 -80 -37 z" fill="#DFC998"/>
    <path d="M20 66 l80 37 80 -37 M100 103 v70" fill="none"/>
    <g stroke-width="2" opacity=".7"><path d="M-150 96 q4 -5 8 0 t8 0 t8 0 t8 0" fill="none"/><path d="M30 118 q4 -5 8 0 t8 0 t8 0" fill="none"/></g>
  </g>
</svg>

<!-- ============ LOGIN ============ -->
