<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIZIM — dizayn stendi</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/brand.css">
<link rel="stylesheet" href="/static/css/platform-theme.css">
<link rel="stylesheet" href="/static/css/onboarding-premium.css">

<body class="ai-ochiq">
<svg class="paper-bg" xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid slice" viewBox="0 0 1440 900" aria-hidden="true">
  <defs>
    <!-- Yengil to'qima: qog'oz hissini beradi, lekin rangsiz -->
    <filter id="toqima" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"
                    seed="17" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>

    <linearGradient id="asos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F4F6FC"/>
      <stop offset="52%"  stop-color="#E2E6F8"/>
      <stop offset="100%" stop-color="#DFE3F3"/>
    </linearGradient>

    <radialGradient id="nur1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#9AA0FF" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#9AA0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nur2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7FD1C9" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7FD1C9" stop-opacity="0"/>
    </radialGradient>

    <!-- Juda sust to'r: «tizim/reja» hissi, e'tiborni tortmaydi -->
    <pattern id="tor" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#5E63E0" stroke-opacity=".05"
            stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="url(#asos)"/>
  <rect width="1440" height="900" fill="url(#tor)"/>
  <rect x="820"  y="-320" width="880" height="880" fill="url(#nur1)"/>
  <rect x="-360" y="420"  width="900" height="900" fill="url(#nur2)"/>
  <rect x="240"  y="600"  width="700" height="700" fill="url(#nur1)" opacity=".5"/>
  <rect width="1440" height="900" filter="url(#toqima)" opacity=".9"/>
</svg>
<div class="app" id="app">
  <aside class="side glass">
    <div class="brand">
      <div class="logo" id="brandLogo"></div>
      <div><h1>TIZIM</h1><small>Бошқарув панели</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">© INNASOFT MChJ<br>TIZIM · v1.0</div>
  </aside>
  <div class="main">
    <header class="topbar glass">
      <div><div class="page-title" id="ptitle">—</div><div class="page-sub" id="psub"></div></div>
      <div class="spacer"></div>
      <select class="fld" id="firmSel" style="width:auto;padding:8px 12px;font-size:12px;font-weight:600;display:none"
        onchange="setFirm(this.value)"></select>
      <div class="userchip"><div class="av" id="uav">?</div><span id="uname">—</span><small id="urole"></small></div>
      <button class="btn sm ghost" onclick="logout()" title="Chiqish">⎋</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="agent-panel ochiq" id="agentPanel">
  <div class="agent-head">
    <div style="flex:1;min-width:0">
      <div class="agent-title" id="agentNom">Ёрдамчи</div>
      <div class="agent-sub" id="agentHolat">gemini · gemini-3.5-flash</div>
    </div>
    <div class="agent-head-btns">
      <button class="agent-icon" title="Yangi suhbat">&#9998;</button>
      <button class="agent-icon" title="Yopish">&#10005;</button>
    </div>
  </div>
  <div class="agent-oqim" id="agentOqim">
    <div class="agent-xabar agentniki"><div class="agent-matn">Savol bering — buyurtma, ombor, pul, xodim, harid: hammasini ko'raman.

Masalan:
• «Kim qancha qarzdor?»
• «Nima tugayapti?»
• «Bu oy qancha kirim bo'ldi?»
• «Qaysi buyurtmalar kechikyapti?»</div></div>
  </div>
  <div class="agent-kirish">
    <textarea id="agentMatn" rows="2" placeholder="Savolingizni yozing…"></textarea>
    <button class="btn agent-yubor">Yuborish</button>
  </div>
</div>
<button id="agentOch" class="agent-och yashir">&#10022;</button>
<div class="toasts" id="toasts"></div>
<div class="overlay" id="overlay"><div class="modal glass" id="modalBox"></div></div>

</body></html>
